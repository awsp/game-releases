<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>王女戦記</title>
    <meta name="theme-color" content="#fde4ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="王女戦記" />
    <link rel="apple-touch-icon" href="/game-releases/tagatame/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/game-releases/tagatame/assets/index-vhuk7tun.js"></script>
    <link rel="stylesheet" crossorigin href="/game-releases/tagatame/assets/index-BaB909rc.css">
  <link rel="manifest" href="/game-releases/tagatame/manifest.webmanifest"></head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="overlay"></div>
      <header id="topbar">
        <div class="brand">
          <span id="gameTitle" class="title"></span>
          <span id="objective" class="objective"></span>
        </div>
        <div class="status glass">
          <span id="turnInfo" class="turn"></span>
          <span id="phaseInfo" class="phase"></span>
          <span id="weatherInfo" class="weather"></span>
        </div>
        <span class="spacer"></span>
        <div class="tools glass">
          <button data-rot="-1" class="icon" title="Q">⟲</button>
          <button data-rot="1" class="icon" title="E">⟳</button>
          <button id="threatBtn" class="icon" title="T">◈</button>
          <button id="muteBtn" class="icon" title="BGM / SE">♪</button>
          <select id="langSel"></select>
          <span class="gm-wrap">
            <button id="gameMenuBtn" class="ghost" aria-haspopup="menu"></button>
            <div id="gameMenu" class="glass" role="menu">
              <button id="saveBtn" role="menuitem"></button>
              <button id="loadBtn" role="menuitem"></button>
              <button id="newGameBtn" role="menuitem"></button>
            </div>
          </span>
          <button id="settingsBtn" class="ghost"></button>
        </div>
        <button id="endPhase" class="primary"></button>
      </header>

      <aside id="unitPanel" class="panel hidden"></aside>
      <div id="tilePanel" class="panel tile"></div>
      <div id="forecast" class="panel"></div>
      <nav id="menu" class="panel"></nav>
      <div id="hint"></div>
      <div id="log" class="panel"></div>
      <div id="help"></div>
      <div id="banner"></div>
      <div id="modal"></div>
    </div>
  </body>
</html>
